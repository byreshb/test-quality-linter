name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  java:
    name: Build and test (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check formatting
        run: mvn -B spotless:check

      - name: Build and test
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts
          path: |
            **/target/site/jacoco/
            **/target/tql/
          if-no-files-found: ignore

  action:
    name: Build and test (GitHub Action)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: action/package-lock.json

      - name: Install dependencies
        working-directory: action
        run: npm ci

      - name: Check formatting, types and lint
        working-directory: action
        run: npm run check

      - name: Test
        working-directory: action
        run: npm test

      - name: Verify dist/ is up to date
        working-directory: action
        run: |
          npm run build
          git diff --exit-code dist/

  vscode-extension:
    name: Build and test (VS Code extension)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Check formatting, types and lint
        working-directory: vscode-extension
        run: npm run check

      - name: Unit test the server and client logic
        working-directory: vscode-extension
        run: npm run test:unit

      - name: Install a virtual display and Electron's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Run the extension in a real VS Code instance
        working-directory: vscode-extension
        run: |
          npm run pretest:extension
          xvfb-run -a npm run test:extension
