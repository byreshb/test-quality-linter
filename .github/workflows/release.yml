name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Check tag matches pom and package versions
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pom_version=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          action_version=$(node -p "require('./action/package.json').version")
          vscode_version=$(node -p "require('./vscode-extension/package.json').version")
          fail=0
          for pair in "pom:$pom_version" "action:$action_version" "vscode-extension:$vscode_version"; do
            name="${pair%%:*}"; version="${pair#*:}"
            if [ "$version" != "$tag_version" ]; then
              echo "Tag v$tag_version does not match $name version $version" >&2
              fail=1
            fi
          done
          exit $fail

      - name: Build jars (tests run in the CI workflow)
        run: mvn -B package -DskipTests

      - name: Package the VS Code extension
        working-directory: vscode-extension
        run: |
          npm ci
          npm run package

      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          echo "--- release notes ---"; cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            */target/tql-*.jar
            vscode-extension/tql-vscode.vsix
